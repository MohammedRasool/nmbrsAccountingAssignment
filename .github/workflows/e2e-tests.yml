name: E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore nmbrsaccounting_testsuite/NmbrsAccounting.Tests.sln

    - name: Build solution
      run: dotnet build nmbrsaccounting_testsuite/NmbrsAccounting.Tests.sln --no-restore

    - name: Install Playwright Browsers
      run: |
        cd nmbrsaccounting_testsuite/NmbrsAccounting.Tests
        pwsh bin/Debug/net10.0/playwright.ps1 install --with-deps

    - name: Start Web Application
      run: |
        cd nmbrsaccounting_webapp/NmbrsAccounting.WebApp
        nohup dotnet run --urls "http://localhost:5000" > webapp.log 2>&1 &
        sleep 10 # Give the app a few seconds to start listening

    - name: Run E2E Tests
      env:
        BASE_URL: http://localhost:5000 # Override the default HTTPS URL for CI
      run: |
        cd nmbrsaccounting_testsuite/NmbrsAccounting.Tests
        dotnet test --no-build --logger "trx;LogFileName=test_results.trx"

    - name: Upload Test Results (TRX)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: nmbrsaccounting_testsuite/NmbrsAccounting.Tests/TestResults/

    - name: Upload HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: html-report
        path: nmbrsaccounting_testsuite/NmbrsAccounting.Tests/bin/Debug/net10.0/ReqnrollExecutionReport.html

    - name: Upload Failure Screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-screenshots
        path: nmbrsaccounting_testsuite/NmbrsAccounting.Tests/bin/Debug/net10.0/artifacts/